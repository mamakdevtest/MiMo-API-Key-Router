services:
  mimo-router:
    image: ghcr.io/mamakdevtest/mimo-api-key-router:latest
    container_name: mimo-api-key-router
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${PORT:-4000}
      - DATABASE_URL=file:/data/mimo-router.sqlite
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - GATEWAY_KEY=${GATEWAY_KEY}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - TRUST_PROXY=true
      - COOKIE_SECURE=true
      - LOG_LEVEL=info
      - SESSION_MAX_AGE_SECONDS=86400
      - ALLOW_PRIVATE_PROVIDER_URLS=${ALLOW_PRIVATE_PROVIDER_URLS:-false}
    volumes:
      - mimo-data:/data
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mimo-data:

services:
  api-router:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mamakdevtest/api-router:latest
    container_name: api-router
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${PORT:-4000}
      - DATABASE_URL=file:/data/api-router.sqlite
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - GATEWAY_KEY=${GATEWAY_KEY}
      - TRUST_PROXY=true
      - COOKIE_SECURE=true
      - LOG_LEVEL=info
      - SESSION_MAX_AGE_SECONDS=86400
      - ALLOW_PRIVATE_PROVIDER_URLS=${ALLOW_PRIVATE_PROVIDER_URLS:-false}
    volumes:
      - api-router-data:/data
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Retains the pre-rebrand named volume by default. Set
  # API_ROUTER_DATA_VOLUME to use a different existing volume explicitly.
  api-router-data:
    name: ${API_ROUTER_DATA_VOLUME:-api-router_mimo-data}
